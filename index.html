<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Noto Sans Arabic',sans-serif;background:#f1f5f9;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#1a1b2e}::-webkit-scrollbar-thumb{background:#4f46e5;border-radius:3px}
.sidebar{width:260px;transition:width .3s ease;position:fixed;top:0;left:0;height:100vh;z-index:50;display:flex;flex-direction:column}
.sidebar.collapsed{width:70px}.sidebar.collapsed .st,.sidebar.collapsed .logo-text,.sidebar.collapsed .nav-label{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:12px 0}
.main{transition:margin-left .3s ease;height:100vh;overflow-y:auto}
.rtl .sidebar{left:auto;right:0}.rtl .main{margin-left:0!important}
.card-h{transition:all .2s}.card-h:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(0,0,0,.1)}
.page-anim{animation:fadeUp .3s ease}@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal-bg .modal-box{transform:scale(.9);transition:transform .2s}.modal-bg.show .modal-box{transform:scale(1)}
.toast-msg{position:fixed;bottom:20px;right:20px;background:#10b981;color:#fff;padding:12px 20px;border-radius:8px;z-index:200;animation:slideR .3s ease}
@keyframes slideR{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.cap-bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}.cap-fill{height:100%;border-radius:4px;transition:width .3s}
.day-btn{padding:8px 16px;border:2px solid #e5e7eb;border-radius:8px;cursor:pointer;transition:all .2s;background:#fff}
.day-btn.on{border-color:#4f46e5;background:#4f46e5;color:#fff}.day-btn:hover{border-color:#4f46e5}
.abtn-pres{border-color:#10b981!important;background:#ecfdf5!important}
.abtn-abs{border-color:#ef4444!important;background:#fef2f2!important}
.abtn-late{border-color:#f59e0b!important;background:#fffbeb!important}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.mob-open{transform:translateX(0)}.main{margin-left:0!important;margin-right:0!important}}
</style>
</head>

<div id="app">
<aside id="sb" class="sidebar bg-[#1a1b2e] text-white">
<div class="p-4 flex items-center gap-3 border-b border-white/10">
<div class="w-10 h-10 bg-primary-600 rounded-lg flex items-center justify-center"><i data-lucide="graduation-cap" class="w-6 h-6"></i></div>
<span class="logo-text font-bold text-lg">EduCenter</span>
</div>
<nav class="flex-1 py-4 overflow-y-auto" id="sbNav"></nav>
<div class="p-4 border-t border-white/10">
<button onclick="toggleSB()" class="w-full flex items-center gap-3 text-gray-400 hover:text-white py-2 rounded-lg px-2">
<i data-lucide="panel-left-close" class="w-5 h-5" id="colIcon"></i>
<span class="st text-sm">Collapse</span>
</button>
</div>
</aside>
<div class="main" id="main">
<header class="bg-white shadow-sm sticky top-0 z-40 px-6 py-3 flex items-center justify-between">
<div class="flex items-center gap-4">
<button onclick="toggleMobSB()" class="md:hidden p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
<h2 class="text-lg font-semibold text-gray-800" id="pageTitle">Dashboard</h2>
</div>
<div class="flex items-center gap-3">
<button onclick="toggleLang()" class="p-2 hover:bg-gray-100 rounded-lg relative" title="Language">
<i data-lucide="globe" class="w-5 h-5 text-gray-600"></i>
<span class="text-xs font-bold absolute -top-1 -right-1 bg-primary-600 text-white rounded-full w-4 h-4 flex items-center justify-center" id="langBadge">EN</span>
</button>
<button onclick="go('#/notifications')" class="p-2 hover:bg-gray-100 rounded-lg relative">
<i data-lucide="bell" class="w-5 h-5 text-gray-600"></i>
<span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
</button>
<div class="flex items-center gap-2 pl-3 border-l border-gray-200">
<div class="w-8 h-8 bg-primary-100 rounded-full flex items-center justify-center"><i data-lucide="user" class="w-4 h-4 text-primary-600"></i></div>
<span class="text-sm font-medium text-gray-700 hidden sm:block" id="headerUserName">Admin</span>
<button onclick="doLogout()" class="p-2 hover:bg-red-50 rounded-lg transition" title="Logout"><i data-lucide="log-out" class="w-4 h-4 text-red-500"></i></button>
</div>
</div>
</header>
<div id="page" class="p-6 page-anim"></div>
</div>
</div>

function importJSON(input){
var file=input.files[0];
if(!file)return;
var reader=new FileReader();
reader.onload=function(ev){
try{
var data=JSON.parse(ev.target.result);
if(data.students)SD=data.students;
if(data.teachers)TN=data.teachers;
if(data.groups)GR=data.groups;
if(data.rooms)RM=data.rooms;
if(data.center)centerInfo=data.center;
if(data.fees)feeStructure=data.fees;
if(data.expenses)expenses=data.expenses;
if(data.academic)acaSet=data.academic;
toast(tr('importSuccess'));
refreshMaster();
}catch(err){
toast(tr('importError'));
}
};
reader.readAsText(file);
}
