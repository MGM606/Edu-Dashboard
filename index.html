<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة EduCenter - إدارة المراكز التعليمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8',
              500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81'
            }
          },
          fontFamily: { sans: ['Inter', 'Noto Sans Arabic', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', 'Noto Sans Arabic', sans-serif; background: #f1f5f9; }
    .sidebar { width: 260px; transition: width .3s; position: fixed; top: 0; right: 0; height: 100vh; z-index: 50; display: flex; flex-direction: column; background: #1a1b2e; color: white; overflow-y: auto; }
    .sidebar.collapsed { width: 70px; }
    .sidebar.collapsed .st, .sidebar.collapsed .logo-text { display: none; }
    .main { transition: margin-right .3s; min-height: 100vh; margin-right: 260px; }
    .sidebar.collapsed ~ .main { margin-right: 70px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: none; align-items: center; justify-content: center; }
    .modal-bg.show { display: flex; }
    .toast-msg { position: fixed; bottom: 20px; right: 20px; background: #10b981; color: #fff; padding: 12px 20px; border-radius: 8px; z-index: 200; }
    .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    @media(max-width:768px) { .sidebar { transform: translateX(100%); } .sidebar.mob-open { transform: translateX(0); } .main { margin-left: 0 !important; margin-right: 0 !important; } }
  </style>
</head>
<body>
  <!-- صفحة الدخول -->
  <div id="loginPage" class="login-page">
    <div class="bg-white rounded-lg shadow-xl p-8 w-96">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-primary-600 rounded-lg flex items-center justify-center mx-auto mb-4">
          <i data-lucide="graduation-cap" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">EduCenter</h1>
        <p class="text-gray-600 text-sm mt-2">منصة إدارة المراكز التعليمية</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">المعرف</label>
          <input id="loginId" type="text" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-primary-600" placeholder="MASTER-001" value="MASTER-001">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
          <input id="loginPassword" type="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-primary-600" placeholder="admin123" value="admin123">
        </div>

        <button onclick="doLogin()" class="w-full bg-primary-600 hover:bg-primary-700 text-white py-2 rounded-lg font-medium transition">
          دخول
        </button>
      </div>

      <p class="text-center text-gray-600 text-xs mt-4">
        بيانات تجريبية: MASTER-001 / admin123
      </p>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="mainApp" style="display:none;">
    <aside id="sb" class="sidebar">
      <div class="p-4 flex items-center gap-3 border-b border-white/10">
        <div class="w-10 h-10 bg-primary-600 rounded-lg flex items-center justify-center"><i data-lucide="graduation-cap" class="w-6 h-6"></i></div>
        <span class="logo-text font-bold text-lg">EduCenter</span>
      </div>
      <nav class="flex-1 py-4" id="sbNav"></nav>
      <div class="p-4 border-t border-white/10">
        <button onclick="toggleSB()" class="w-full flex items-center gap-3 text-gray-400 hover:text-white py-2 rounded-lg px-2">
          <i data-lucide="panel-left-close" class="w-5 h-5"></i>
          <span class="st text-sm">Collapse</span>
        </button>
      </div>
    </aside>

    <div class="main" id="main">
      <header class="bg-white shadow-sm sticky top-0 z-40 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button onclick="toggleMobSB()" class="md:hidden p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
          <h2 class="text-lg font-semibold text-gray-800" id="pageTitle">Dashboard</h2>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="toggleLang()" class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="globe" class="w-5 h-5"></i></button>
          <div class="flex items-center gap-2 pl-3 border-l border-gray-200">
            <span class="text-sm font-medium text-gray-700" id="headerUserName">Admin</span>
            <button onclick="doLogout()" class="p-2 hover:bg-red-50 rounded-lg"><i data-lucide="log-out" class="w-4 h-4 text-red-500"></i></button>
          </div>
        </div>
      </header>
      <div id="page" class="p-6"></div>
    </div>
  </div>

  <div id="modalWrap"></div>

  <script src="data/initialData.js"></script>
  <script src="components/students.js"></script>
  <script src="components/classes.js"></script>
  <script src="components/attendance.js"></script>

  <script>
    let lang = localStorage.getItem('lang') || 'ar';
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
    let currentRoute = '#/dashboard';

    const navItems = [
      { route: '#/dashboard', icon: 'home', label: 'Dashboard' },
      { route: '#/students', icon: 'users', label: 'الطلاب' },
      { route: '#/classes', icon: 'book-open', label: 'الفصول' },
      { route: '#/attendance', icon: 'calendar-check', label: 'الحضور' }
    ];

    function doLogin() {
      const id = document.getElementById('loginId').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!id || !password) {
        alert('يرجى ملء جميع الحقول');
        return;
      }

      if (id === 'MASTER-001' && password === 'admin123') {
        currentUser = { id: 'MASTER-001', name: 'Master Admin', role: 'master' };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        
        buildSB();
        renderPage();
        lucide.createIcons();
      } else {
        alert('بيانات دخول خاطئة!');
      }
    }

    function doLogout() {
      if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
        localStorage.removeItem('currentUser');
        currentUser = null;
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('loginId').value = 'MASTER-001';
        document.getElementById('loginPassword').value = 'admin123';
      }
    }

    function buildSB() {
      const sbNav = document.getElementById('sbNav');
      let html = navItems.map(item => `
        <a href="javascript:void(0)" onclick="go('${item.route}')" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white transition ${currentRoute === item.route ? 'text-white bg-primary-600' : ''}">
          <i data-lucide="${item.icon}" class="w-5 h-5"></i>
          <span class="st text-sm">${item.label}</span>
        </a>
      `).join('');
      sbNav.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    function go(route) {
      currentRoute = route;
      renderPage();
      buildSB();
    }

    function renderPage() {
      const page = document.getElementById('page');
      let html = '<div class="text-center py-12"><p class="text-gray-500">قيد التطوير...</p></div>';

      if (currentRoute === '#/dashboard') {
        const students = getData('students');
        const classes = getData('classes');
        html = `
          <div class="space-y-6">
            <h2 class="text-3xl font-bold text-gray-800">لوحة التحكم</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                <p class="text-gray-600 text-sm">إجمالي الطلاب</p>
                <p class="text-3xl font-bold text-primary-600 mt-2">${students.length}</p>
              </div>
              <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                <p class="text-gray-600 text-sm">عدد الفصول</p>
                <p class="text-3xl font-bold text-green-600 mt-2">${classes.length}</p>
              </div>
              <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                <p class="text-gray-600 text-sm">المعلمون</p>
                <p class="text-3xl font-bold text-blue-600 mt-2">1</p>
              </div>
              <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm">
                <p class="text-gray-600 text-sm">المراكز</p>
                <p class="text-3xl font-bold text-purple-600 mt-2">1</p>
              </div>
            </div>
          </div>
        `;
      } else if (currentRoute === '#/students') {
        html = StudentsComponent.render();
      } else if (currentRoute === '#/classes') {
        html = ClassesComponent.render();
      } else if (currentRoute === '#/attendance') {
        html = AttendanceComponent.render();
      }

      page.innerHTML = html;
      setTimeout(() => lucide.createIcons(), 50);
    }

    function toggleSB() {
      document.getElementById('sb').classList.toggle('collapsed');
    }

    function toggleMobSB() {
      document.getElementById('sb').classList.toggle('mob-open');
    }

    function toggleLang() {
      lang = lang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('lang', lang);
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      renderPage();
      buildSB();
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'toast-msg';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function showM(id) {
      const m = document.getElementById(id);
      if (m) m.classList.add('show');
    }

    function hideM(id) {
      const m = document.getElementById(id);
      if (m) m.classList.remove('show');
    }

    // تهيئة
    document.addEventListener('DOMContentLoaded', () => {
      initializeData();
      if (currentUser) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('headerUserName').textContent = currentUser.name;
        buildSB();
        renderPage();
      }
      lucide.createIcons();
    });

    // اختبار الدخول عند الضغط على Enter
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') {
        doLogin();
      }
    });
  </script>
</body>
</html>
